<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security Predictions</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #616e7c;
            --border: #e4e7eb;
            --header: #1f3a5f;
            --header-text: #ffffff;
            --row-alt: #f9fafb;
            --row-hover: #eef4ff;
            --safe: #1b873f;
            --threat: #c62828;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12161c;
                --card: #1b2129;
                --text: #e4e7eb;
                --muted: #9aa5b1;
                --border: #2d3640;
                --header: #243b55;
                --row-alt: #1f262f;
                --row-hover: #263241;
                --safe: #4cc274;
                --threat: #ef5350;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; }
        p.subtitle { margin: 0 0 20px; color: var(--muted); }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: auto;
            max-height: 80vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            white-space: nowrap;
        }
        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        thead th {
            position: sticky;
            top: 0;
            background: var(--header);
            color: var(--header-text);
            font-weight: 600;
            z-index: 1;
        }
        tbody tr:nth-child(even) { background: var(--row-alt); }
        tbody tr:hover { background: var(--row-hover); }
        td.safe { color: var(--safe); font-weight: 600; }
        td.threat { color: var(--threat); font-weight: 600; }
        a.back {
            display: inline-block;
            margin-top: 16px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Security Predictions</h1>
        <p class="subtitle">Prediction results for the uploaded file. The model's output is in <code>predicted_column</code>.</p>

        <div class="card">
            {{ table | safe }}
        </div>

        <a class="back" href="/docs">&larr; Back to API docs</a>
    </div>

    <script>
        // Highlight the prediction column, if present
        const table = document.querySelector(".card table");
        if (table) {
            const headers = [...table.querySelectorAll("thead th")];
            const idx = headers.findIndex(th => th.textContent.trim() === "predicted_column");
            if (idx !== -1) {
                table.querySelectorAll("tbody tr").forEach(tr => {
                    const cell = tr.children[idx];
                    if (!cell) return;
                    cell.classList.add(parseFloat(cell.textContent) === 1 ? "safe" : "threat");
                });
            }
        }
    </script>
</body>
</html>
